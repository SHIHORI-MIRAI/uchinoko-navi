  .btn:hover{background:var(--accent-dark); transform:translateY(-2px); box-shadow:var(--shadow-lg)}
  .btn.line{background:#06C755; box-shadow:0 6px 20px rgba(6,199,85,.28)}

  /* 常時表示の追従CTA */

    padding:12px 20px; border-radius:999px; font-weight:800; font-size:15px; box-shadow:var(--shadow-lg)}
  .float-cta:hover{background:var(--accent-dark)}
  @media(max-width:520px){.float-cta{padding:11px 16px; font-size:14px}}
  footer{padding:30px 20px 46px; text-align:center; color:var(--sub); font-size:12.5px; background:var(--bg)}
  footer .disc{background:var(--accent-soft); color:#8a5a22; border-radius:12px; padding:14px 18px;
